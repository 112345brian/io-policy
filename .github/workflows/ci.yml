name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable)
        run: python -m pip install --upgrade pip pytest ruff setuptools build -e .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest
      - name: Build the wheel and sdist
        run: python -m build
